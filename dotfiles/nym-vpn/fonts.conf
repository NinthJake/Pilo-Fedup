<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!--
    NymVPN's AppImage bundles an old WebKitGTK whose Skia crashes (SIGABRT
    in colrv1_configure_skpaint) when rendering COLRv1 color fonts.
    Reject the system's COLRv1 emoji font for this app only.
    Used via FONTCONFIG_FILE in the nym-vpn.desktop entry.
  -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
