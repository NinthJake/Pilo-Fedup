# foot terminal configuration
# Managed by fedup — see ~/.config/fedup/dotfiles.toml

[main]
font=FiraCode Nerd Font:size=14

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[csd]
preferred=none

[colors-dark]
# vague.nvim palette — https://github.com/vague2k/vague.nvim
alpha=0.85
alpha-mode=all
# Ask the compositor to blur behind the window via ext-background-effect-v1.
# Required since Hyprland 0.56 — its own decoration:blur no longer applies
# to foot (upstream: "blur is a client-side setting", discussions #15524/#15530).
blur=yes
background=141415
foreground=cdcdcd
regular0=252530
regular1=d8647e
regular2=7fa563
regular3=f3be7c
regular4=7e98e8
regular5=bb9dbd
regular6=b4d4cf
regular7=cdcdcd
bright0=606079
bright1=c48282
bright2=7fa563
bright3=e0a363
bright4=7e98e8
bright5=bb9dbd
bright6=9bb4bc
bright7=e0e0e0

[search-bindings]
find-prev=Control+p
