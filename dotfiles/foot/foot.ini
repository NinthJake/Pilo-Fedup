# foot terminal configuration
# Managed by fedup — see ~/.config/fedup/dotfiles.toml

[main]
font=FiraCode Nerd Font:size=14
selection-target=both
# Colours follow the pilo theme; the bar regenerates this file.
include=~/.config/foot/colors.ini

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[csd]
preferred=none

[colors-dark]
# Colours are generated by the pilo bar (Theming) into ~/.config/foot/colors.ini
# and included above; only the structural bits stay here.
alpha=0.85
alpha-mode=all
# Ask the compositor to blur behind the window via ext-background-effect-v1.
# Required since Hyprland 0.56 — its own decoration:blur no longer applies
# to foot (upstream: "blur is a client-side setting", discussions #15524/#15530).
blur=yes

[mouse-bindings]
select-extend=none
clipboard-paste=BTN_RIGHT

[search-bindings]
find-prev=Control+p
