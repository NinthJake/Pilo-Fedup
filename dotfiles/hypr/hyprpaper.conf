# hyprpaper — wallpaper daemon (hyprlang block syntax, hyprpaper >= 0.8)
# Docs: https://wiki.hyprland.org/Hyprland-Ecosystem/hyprpaper/
#
# No wallpaper {} blocks here on purpose: a random wallpaper per monitor is
# picked once at startup by ~/.config/hypr/random-wallpaper.sh (wired up in
# hyprland.lua's AUTOSTART section) via hyprpaper's IPC, instead of using
# hyprpaper's own directory rotation (timeout/order). That means each monitor
# still gets its own random pick, but it's set once per session and never
# rotates again until the next login. IPC must stay on for the script to work.
splash = false
ipc = on
