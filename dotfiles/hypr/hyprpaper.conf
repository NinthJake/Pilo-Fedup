# hyprpaper — wallpaper daemon (hyprlang block syntax, hyprpaper >= 0.8)
# Docs: https://wiki.hyprland.org/Hyprland-Ecosystem/hyprpaper/
#
# No wallpaper {} blocks here on purpose: a random wallpaper per monitor is
# instead picked and rotated on an interval by
# ~/.config/hypr/random-wallpaper.sh (wired up in hyprland.lua's AUTOSTART
# section as a long-lived background process) via hyprpaper's IPC, instead of
# using hyprpaper's own directory rotation (timeout/order). That gives each
# monitor its own independent random pick on every rotation, and lets the
# switch crossfade via hyprland.lua's "wallpaper-crossfade" layer_rule. IPC
# must stay on for the script to work.
splash = false
ipc = on
