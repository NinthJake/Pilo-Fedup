# hypridle — idle daemon: lock the screen and power down displays on inactivity
# (hyprlang format, not Lua)
# Docs: https://wiki.hyprland.org/Hyprland-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # don't start multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # screens back on after resume
}

# Lock after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn displays off after 15 minutes
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
