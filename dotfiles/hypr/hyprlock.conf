# hyprlock — screen lock, vague.nvim palette (managed by fedup)
# Colors here use hyprland rgba() notation

general {
    hide_cursor = true
    grace = 2
}

background {
    color = rgba(20, 20, 21, 1.0)
    blur_passes = 2
    blur_size = 4
}

# Clock
label {
    text = $TIME
    color = rgba(205, 205, 205, 1.0)
    font_size = 72
    font_family = FiraCode Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    text = $USER
    color = rgba(96, 96, 121, 1.0)
    font_size = 16
    font_family = FiraCode Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 340, 52
    outline_thickness = 2
    rounding = 8

    inner_color = rgba(28, 28, 36, 1.0)
    outer_color = rgba(180, 212, 207, 1.0)
    font_color = rgba(205, 205, 205, 1.0)
    check_color = rgba(126, 152, 232, 1.0)
    fail_color = rgba(216, 100, 126, 1.0)

    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##606079">password…</span>

    position = 0, -40
    halign = center
    valign = center
}
