[git]
repos = [
    # pilo bar — Quickshell bar for Hyprland, launched from hyprland.lua with
    # `qs -c pilo`. Cloned to ~/.config/quickshell/pilo (branch main) at a fresh
    # install when the path is missing; pull = false so a sync never updates the
    # working copy out from under the running bar. Set pull = true to have fedup
    # keep it up to date.
    { url = "https://github.com/NinthJake/PiloBar.git", path = "~/.config/quickshell/pilo", branch = "main", pull = false },
]
