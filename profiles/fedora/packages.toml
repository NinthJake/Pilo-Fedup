[dnf]
install = [
    "bash-completion",
    "brave-origin-nightly",
    "cargo",
    "codium",
    "curl",
    "dnf5-plugins",
    "eza",
    "flatpak",
    "fuse-libs",
    "fzf",
    "git",
    "gnome-disk-utility",
    "hyprpolkitagent",
    "nano",
    "polkit",
    "steam",
    "trash-cli",
    "unzip",
    "wl-clipboard",
    "wl-paste",
    "wtype",
    "xclip",
    "xdotool",
    "ydotool",
    "zoxide",

    # Desktop shell — the pilo bar (Quickshell) replaced pibble, waybar and wofi.
    "quickshell",            # runs the bar (qs -c pilo)
    "matugen",               # theme generator (available, not wired into the config)
    "cliphist",              # clipboard history (wl-paste watchers in hyprland.lua)
    "ffmpeg", "firefox",     # media / browser
    "fastfetch.x86_64",

    # HyprMod toolchain — PyGObject/pycairo build from sdist (uv, in the
    # shared hyprmod hook) plus the GTK4/libadwaita typelibs loaded at runtime.
    "cairo-devel",
    "gcc",
    "gobject-introspection-devel",
    "gtk4",
    "libadwaita",
    "pkgconf-pkg-config",
    "python3-devel",
]

[flatpak]
install = [
    "com.github.tchx84.Flatseal",
    "com.usebottles.bottles",
    "io.github.kolunmi.Bazaar"
]

[pip]
install = [
    "piper-onnx"
]

[npm]
install = [

]
