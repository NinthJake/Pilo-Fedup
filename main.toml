# =============================================================================
# Shared settings + hooks — applied on every machine
# =============================================================================
# Machine/distro-specific configuration lives in profiles/<name>/:
#   profiles/fedora/   — the Nobara/Fedora desktop (dnf, Hyprland COPR, …)
#   profiles/piloarch/ — the Arch desktop (paru, pilo bar, …)
#
# A profile is activated by the [profiles.hosts] map below, per-machine
# profile.local.toml, or `fedup --profile <name>`.
#
# NOTE: auto_prune is intentionally OFF here and turned ON inside the profiles
# that want it. If a machine ends up with no profile active, a sync then does
# nothing destructive instead of pruning every tracked package.
# =============================================================================

[settings]
auto_prune = false

# auto_push = true commits + pushes this config repo after sync
auto_push = true

[hooks]
pre = [
    "echo 'Starting fedup sync...'",
    # Install Cursor agent if not already installed
    { cmd = "curl https://cursor.com/install -fsS | bash", unless = "test -f ~/.local/bin/cursor-agent" },
    # Install opencode if not already installed
    { cmd = "curl -fsSL https://opencode.ai/install | bash", unless = "test -f ~/.opencode/bin/opencode" },
    # Install HyprMod (GTK4/libadwaita settings app for Hyprland) if missing.
    # Bootstrap uv first: install.sh prompts on a tty when neither uv nor pipx
    # is available, and hooks run unattended. PATH covers uv's ~/.local/bin
    # install and the `hyprmod --install` desktop-entry step.
    { cmd = "export PATH=\"$HOME/.local/bin:$PATH\"; { command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh; } && curl -LsSf https://raw.githubusercontent.com/BlueManCZ/hyprmod/main/install.sh | sh", unless = "test -x ~/.local/bin/hyprmod" },
    # Download pika wallpapers (only backgrounds/pika/ from the repo) if missing
    { cmd = 'tmp=$(mktemp -d) && git clone --depth 1 https://github.com/PikaOS-Linux/pkg-pika-wallpapers.git "$tmp/repo" && mkdir -p ~/Pictures/Wallpapers/pika && cp -a "$tmp/repo/backgrounds/pika/." ~/Pictures/Wallpapers/pika/ && rm -rf "$tmp"', unless = "test -d ~/Pictures/Wallpapers/pika" },
    # Download the ML4W wallpaper collection (~750 MB of jpg/png) into
    # ~/Pictures/Wallpapers/MLFW, next to the PikaOS set in .../pika.
    # random-wallpaper.sh searches all of ~/Pictures/Wallpapers recursively.
    # `unzip` patterns need the * glob; the repo ships no .webp files, and
    # unmatched patterns make unzip exit non-zero, so only jpg/jpeg/png here.
    # The guard checks one of the shipped files, so losing state.json does not
    # re-download ~780 MB.
    { cmd = "curl -fL https://github.com/mylinuxforwork/wallpaper/archive/refs/heads/main.zip -o /tmp/mlfw-wallpapers.zip && mkdir -p ~/Pictures/Wallpapers/MLFW && unzip -q -j -o /tmp/mlfw-wallpapers.zip 'wallpaper-main/*.jpg' 'wallpaper-main/*.jpeg' 'wallpaper-main/*.png' -d ~/Pictures/Wallpapers/MLFW && rm -f /tmp/mlfw-wallpapers.zip", once = true, unless = "test -f ~/Pictures/Wallpapers/MLFW/Nocturne-of-Steel-and-Glass.png" },
]
post = [
    "echo 'Done!'",
]
