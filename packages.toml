[dnf]
install = [
    "bash-completion",
    "brave-origin-nightly",
    "cargo",
    "codium",
    "curl",
    "dnf5-plugins",
    "eza",
    "flatpak",
    "fuse-libs",
    "fzf",
    "git",
    "gnome-disk-utility",
    "hyprpolkitagent",
    "nano",
    "polkit",
    "steam",
    "trash-cli",
    "unzip",
    "wl-clipboard",
    "wl-paste",
    "wtype",
    "xclip",
    "xdotool",
    "ydotool",
    "zoxide",

    # pibble — desktop shell dependencies
    "quickshell",            # runs the shell
    "matugen",                # wallpaper-derived color theme
