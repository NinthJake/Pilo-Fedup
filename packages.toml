# =============================================================================
# Shared packages — the portable [system] list, valid on any distro
# =============================================================================
# Distro-specific package lists live in the machine profiles:
#   profiles/fedora/packages.toml   ([dnf] + flatpak + pip + npm)
#   profiles/piloarch/packages.toml ([paru])
#
# [system] applies to whichever system manager is active (dnf/apt/pacman/paru).
# =============================================================================

[system]
install = [
    "curl",
    "git",
]
remove = []
